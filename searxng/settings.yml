use_default_settings: true 

server:
  secret_key: "b0b17906390d3ac58b9336a0cfbf43bee0d04462b7be6d3918fe2a78198ab974"
  limiter: false

search:
  safe_search: 0

  formats:
    - html
    - json

outgoing:
  requests_timeout: 6.0
  max_request_timeout: 15.0

engines:
  # general web — enable
  - name: bing
    disabled: false
    language: en-GB
  - name: mojeek
    disabled: false
  - name: mwmbl
    disabled: true  # bad results 
  - name: stract
    disabled: false
  - name: right dao
    disabled: false
  - name: yep
    disabled: false

  # science
  - name: crossref
    disabled: false
  - name: openalex
    disabled: false
  - name: arxiv
    timeout: 10.0

  # the noise sources that caused the original bug
  - name: wiktionary
    disabled: true
  - name: ddg definitions
    disabled: true
  - name: dictzone
    disabled: true
  - name: etymonline
    disabled: true
  - name: wordnik
    disabled: true
  - name: duden
    disabled: true
  - name: currency
    disabled: true

  # scrapers that got you banned — off, but available later
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true

  # wikidata: init fails on 403 from query.wikidata.org
  - name: wikidata
    disabled: true

hostnames:
  remove:
    - '(.*\.)?merriam-webster\.com$'
    - '(.*\.)?dictionary\.cambridge\.org$'
    - '(.*\.)?dictionary\.com$'
    - '(.*\.)?collinsdictionary\.com$'
    - '(.*\.)?thesaurus\.com$'
    - '(.*\.)?pinterest\.com$'
    - '(.*\.)?facebook\.com$'
    - '(.*\.)?instagram\.com$'
    - '(.*\.)?tiktok\.com$'
    - '(.*\.)?x\.com$'
    - '(.*\.)?twitter\.com$'
    - '(.*\.)?linkedin\.com$'
    - '(.*\.)?medium\.com$'
    - '(.*\.)?grammarly\.com$'
    - '(.*\.)?jstor\.org$'
    - '(.*\.)?books\.google\.co\.uk$'
    - '(.*\.)?quora\.com$'
    - '(.*\.)?tandfonline\.com$'           # 403 on PDFs
    - '(.*\.)?sciencedirect\.com$'         # paywalled
    - '(.*\.)?springer\.com$'              # paywalled
    - '(.*\.)?link\.springer\.com$'        # same
    - '(.*\.)?wiley\.com$'                 # paywalled
    - '(.*\.)?onlinelibrary\.wiley\.com$'  # same
    - '(.*\.)?proquest\.com$'              # 403/login wall
    - '(.*\.)?studocu\.com$'               # 403
    - '(.*\.)?ceeol\.com$'                 # 403
    - '(.*\.)?academia\.edu$'              # interstitial wall, trafilatura fails
    - '(.*\.)?researchgate\.net$'          # interstitial wall
    - '(.*\.)?reddit\.com$'     
    - '(.*\.)?youtube\.com$'      

  